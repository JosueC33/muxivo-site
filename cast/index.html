<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Muxivo</title>
  <style>
    /* The receiver is full-bleed video; everything else is diagnostics that
       only appear when something has already gone wrong. */
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    cast-media-player { --background-color: #000; --splash-color: #000; }
    #err {
      position: fixed; left: 0; right: 0; bottom: 0;
      font: 22px/1.4 -apple-system, Roboto, sans-serif;
      color: #fff; background: rgba(140, 20, 20, .92);
      padding: 20px 28px; display: none; white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <cast-media-player></cast-media-player>
  <div id="err"></div>

  <!-- Protocol-relative on purpose: the SDK is then fetched over whatever
       scheme served this page, so an http:// dev copy and the https:// published
       copy both work without editing. Google's docs are explicit that this file
       must never be self-hosted. -->
  <script src="//www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
  <script>
    const ctx     = cast.framework.CastReceiverContext.getInstance();
    const options = new cast.framework.CastReceiverOptions();

    // THE ONE LINE THIS PAGE EXISTS FOR.
    //
    // Muxivo's engine emits fragmented MP4 (seg*.m4s + EXT-X-MAP) because that
    // is what AVAssetWriter's MPEG4AppleHLS profile produces, and fMP4 is what
    // AirPlay wants. The Default Media Receiver's Media Player Library cannot
    // play HLS with fMP4 segments — measured against a real Hisense Google TV:
    // the receiver fetched the manifest three times and answered LOAD_FAILED,
    // while the identical content muxed to MPEG-TS played immediately. Shaka
    // handles fMP4 HLS natively, and Google's own CAF team recommends this flag
    // rather than changing the container.
    options.useShakaForHls = true;

    // Muxivo serves from a plain-HTTP server on the viewer's own LAN
    // (Sources/StreamServer.swift). Measured on real hardware: a Cast receiver
    // fetches http:// media happily, so no mixed-content exemption is needed.
    // Left here because it is the first thing anyone will suspect.
    options.disableIdleTimeout = false;

    // Bare LOAD_FAILED with no reason cost an evening of bisecting. Whatever
    // the receiver rejects, say so ON THE TELEVISION, where the person holding
    // the remote can read it.
    const show = (msg) => {
      const el = document.getElementById('err');
      el.textContent = msg;
      el.style.display = 'block';
    };

    const pm = ctx.getPlayerManager();

    pm.addEventListener(cast.framework.events.EventType.ERROR, (e) => {
      show('Muxivo could not play this stream.\n'
         + 'reason: ' + (e.detailedErrorCode || e.reason || 'unknown')
         + (e.error && e.error.message ? '\n' + e.error.message : ''));
    });

    // A load that never completes looks identical to a dead network from the
    // sofa; name which one it is.
    pm.setMessageInterceptor(
      cast.framework.messages.MessageType.LOAD,
      (request) => {
        document.getElementById('err').style.display = 'none';
        if (!request.media || !request.media.contentId) {
          show('Muxivo sent a load with no media URL.');
          throw new Error('no contentId');
        }
        return request;
      });

    ctx.start(options);
  </script>
</body>
</html>
